<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMOS - Medicines</title>
<style>
:root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --secondary: #ecfdf5;
    --secondary-text: #059669;
    --bg-color: #f3f4f6;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --warning: #f59e0b;
    --warning-hover: #d97706;
}

body{
    margin:0;
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
    color: var(--text-main);
    min-height: 100vh;
}

header{
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    color: var(--text-main);
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo{
    font-size:24px;
    font-weight:800;
    background: linear-gradient(135deg, #4f46e5, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

nav a{
    color:#1f2937;
    text-decoration:none;
    margin-left:24px;
    font-weight: 500;
    transition: all 0.2s;
    padding: 8px 12px;
    border-radius: 8px;
}

nav a:hover{
    background: rgba(79, 70, 229, 0.1);
    color: #4f46e5;
}

.container{
    max-width:1100px;
    margin:0 auto;
    padding:40px;
}

.title{
    margin:0;
    color:#2c3e50;
    font-size:30px;
}

.subtitle{
    margin:8px 0 18px;
    color:#64748b;
}

.top-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
}

.top-bar input, .top-bar select{
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    background: rgba(255, 255, 255, 0.5);
    transition: all 0.2s;
}

.top-bar input:focus, .top-bar select:focus{
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.top-bar input{
    min-width:220px;
    flex:1;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-bottom:16px;
}

.stat{
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius:16px;
    padding:20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    transition: transform 0.2s, box-shadow 0.2s;
}

.stat:hover{
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    transform: translateY(-2px);
}

.stat-label{
    font-size:13px;
    color:#6b7280;
}

.stat-value{
    margin-top:6px;
    font-size:26px;
    font-weight:bold;
    color:#1d4ed8;
}

.med-list{
    display:grid;
    gap:10px;
}

.med-card{
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius:16px;
    padding:20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    transition: transform 0.2s, box-shadow 0.2s;
}

.med-card:hover{
    transform: translateY(-2px);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

.med-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
}

.med-name{
    margin:0;
    font-size:18px;
    color:#1f2937;
}

.meta{
    margin-top:6px;
    color:#64748b;
    font-size:13px;
}

.status{
    font-size:12px;
    font-weight:bold;
    padding:4px 8px;
    border-radius:999px;
}

.ok{
    background:#dcfce7;
    color:#166534;
}

.low{
    background:#fef3c7;
    color:#92400e;
}

.critical{
    background:#fee2e2;
    color:#991b1b;
}

.actions{
    margin-top:10px;
}

.delete-btn{
    border:none;
    background:#ef4444;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition: background 0.2s, transform 0.2s;
}

.delete-btn:hover{
    background:#dc2626;
    transform: translateY(-1px);
}

.empty{
    background:white;
    border:1px dashed #cbd5e1;
    border-radius:8px;
    padding:20px;
    text-align:center;
    color:#64748b;
}

.hint{
    margin-top:8px;
    font-size:13px;
    color:#64748b;
}

@media (max-width: 900px){
    .stats{
        grid-template-columns:repeat(2, 1fr);
    }
}

@media (max-width: 640px){
    header{
        padding:14px 16px;
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
    }

    nav a{
        margin-left:0;
        margin-right:14px;
    }

    .container{
        padding:20px 16px 40px;
    }

    .stats{
        grid-template-columns:1fr;
    }
}
</style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<header>
    <div class="logo"><i class="fa-solid fa-pills" style="margin-right: 8px;"></i>AMOS</div>
    <nav>
        <a href="home.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="Reminders.html"><i class="fa-solid fa-bell"></i> Reminders</a>
        <a href="order.html"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
        <a href="Medicine.html" style="color: var(--primary); background: rgba(79, 70, 229, 0.1);"><i class="fa-solid fa-capsules"></i> Medicines</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
</header>

<div class="container">
    <h1 class="title">Submitted Medicines</h1>
    <p class="subtitle">List of medicines submitted by the user.</p>

    <section class="top-bar">
        <input type="text" id="searchInput" placeholder="Search medicine name">
        <select id="statusFilter">
            <option value="all">All Stock Status</option>
            <option value="ok">In Stock</option>
            <option value="low">Low Stock</option>
            <option value="critical">Critical</option>
        </select>
    </section>

    <section class="stats">
        <article class="stat">
            <div class="stat-label">Total Medicines</div>
            <div class="stat-value" id="totalCount">0</div>
        </article>
        <article class="stat">
            <div class="stat-label">In Stock</div>
            <div class="stat-value" id="okCount">0</div>
        </article>
        <article class="stat">
            <div class="stat-label">Low Stock</div>
            <div class="stat-value" id="lowCount">0</div>
        </article>
        <article class="stat">
            <div class="stat-label">Critical</div>
            <div class="stat-value" id="criticalCount">0</div>
        </article>
    </section>

    <section id="medList" class="med-list"></section>
</div>

<script src="api.js"></script>
<script>
requireAuth();

var medList = document.getElementById("medList");
var searchInput = document.getElementById("searchInput");
var statusFilter = document.getElementById("statusFilter");
var allMedicines = [];

function stockStatus(quantity, dosage) {
    var daysLeft = dosage > 0 ? Math.floor(quantity / dosage) : quantity;
    if (daysLeft <= 2) return { key: "critical", label: "Critical" };
    if (daysLeft <= 7) return { key: "low", label: "Low Stock" };
    return { key: "ok", label: "In Stock" };
}

function updateStats(medicines) {
    var counts = { total: medicines.length, ok: 0, low: 0, critical: 0 };
    medicines.forEach(function (item) {
        var st = stockStatus(Number(item.tabletsQty || 0), Number(item.dosagePerDay || 1)).key;
        counts[st] += 1;
    });

    document.getElementById("totalCount").textContent = counts.total;
    document.getElementById("okCount").textContent = counts.ok;
    document.getElementById("lowCount").textContent = counts.low;
    document.getElementById("criticalCount").textContent = counts.critical;
}

function filteredMedicines() {
    var query = searchInput.value.trim().toLowerCase();
    var selected = statusFilter.value;

    return allMedicines.filter(function (item) {
        var st = stockStatus(Number(item.tabletsQty || 0), Number(item.dosagePerDay || 1)).key;
        var matchStatus = selected === "all" ? true : st === selected;
        var matchSearch = (item.medicineName || "").toLowerCase().includes(query);
        return matchStatus && matchSearch;
    });
}

async function deleteMedicine(id) {
    try {
        await api("DELETE", "/medicines/" + id);
        allMedicines = allMedicines.filter(function (item) { return item.id !== id; });
        render();
    } catch (err) {
        alert("Failed to delete: " + err.message);
    }
}

function render() {
    var medicines = filteredMedicines();
    updateStats(allMedicines);
    medList.innerHTML = "";

    if (allMedicines.length === 0) {
        medList.innerHTML = '<div class="empty">No medicines submitted yet.</div>';
        return;
    }

    if (medicines.length === 0) {
        medList.innerHTML = '<div class="empty">No medicines match the selected filters.</div>';
        return;
    }

    medicines.forEach(function (item) {
        var quantity = Number(item.tabletsQty || 0);
        var dosage = Number(item.dosagePerDay || 1);
        var daysLeft = dosage > 0 ? Math.floor(quantity / dosage) : quantity;
        var st = stockStatus(quantity, dosage);
        var notes = item.notes ? item.notes : "No notes provided.";
        var addedDate = item.createdAt ? new Date(item.createdAt).toLocaleDateString() : "-";

        var card = document.createElement("article");
        card.className = "med-card";
        card.innerHTML =
            '<div class="med-head">' +
                '<h3 class="med-name">' + (item.medicineName || "Medicine") + '</h3>' +
                '<span class="status ' + st.key + '">' + st.label + '</span>' +
            '</div>' +
            '<div class="meta">Dosage/Day: ' + dosage + ' | Quantity: ' + quantity + ' | Estimated Days Left: ' + daysLeft + '</div>' +
            '<div class="meta">Reorder Level: ' + (item.reorderLevel || "-") + ' | Added: ' + addedDate + '</div>' +
            '<div class="meta">Notes: ' + notes + '</div>' +
            '<div class="actions">' +
                '<button class="delete-btn" data-id="' + item.id + '">Delete</button>' +
            '</div>';
        medList.appendChild(card);
    });

    document.querySelectorAll(".delete-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
            deleteMedicine(Number(btn.dataset.id));
        });
    });
}

async function loadMedicines() {
    try {
        allMedicines = await api("GET", "/medicines");
        render();
    } catch (err) {
        medList.innerHTML = '<div class="empty">Failed to load medicines.</div>';
    }
}

searchInput.addEventListener("input", render);
statusFilter.addEventListener("change", render);

loadMedicines();
</script>
</body>
</html>
